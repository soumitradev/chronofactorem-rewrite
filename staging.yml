version: 1
compose: docker-compose.staging.yml
secrets: true
hooks:
  setup: sh deploy/setup-ditto.sh
expose:
  - name: web
    service: web
    port: 80
    healthcheck:
      path: /healthz
      timeout: 120s
# The preview inspector files issues on the upstream repo, not this fork.
inspector:
  issues: crux-bphc/chronofactorem-rewrite
